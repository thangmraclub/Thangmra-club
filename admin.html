<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Thangmra Club Admin</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="brand">

<img src="logo.png">

<h1>Thangmra Club Admin</h1>

</div>

</header>



<main class="admin">


<div id="loginBox">

<h2>Admin Login</h2>


<input
id="email"
type="email"
placeholder="Admin Email"
>


<input
id="password"
type="password"
placeholder="Password"
>


<button id="loginBtn">
Login
</button>


<p id="loginMessage"></p>

</div>



<div id="adminPanel" style="display:none;">


<button id="logoutBtn">
Logout
</button>


<hr>


<h2>নতুন সদস্য যোগ করুন</h2>


<input
id="memberName"
placeholder="সদস্যের নাম"
>


<input
id="memberPosition"
placeholder="পদবি"
>


<input
id="memberPhone"
placeholder="মোবাইল নম্বর"
>


<button id="addMember">
সদস্য যোগ করুন
</button>



<h2>সদস্যদের তালিকা</h2>

<div id="adminMembers"></div>



<hr>


<h2>নতুন নোটিশ</h2>


<input
id="noticeTitle"
placeholder="নোটিশের শিরোনাম"
>


<textarea
id="noticeText"
placeholder="নোটিশ লিখুন"
></textarea>


<button id="addNotice">
নোটিশ প্রকাশ করুন
</button>



<h2>নোটিশ তালিকা</h2>

<div id="adminNotices"></div>


</div>


</main>



<script type="module">

import {
auth,
db,
signInWithEmailAndPassword,
signOut,
ref,
push,
set,
remove,
onValue
} from "./firebase.js";



const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");



/* LOGIN */

document.getElementById("loginBtn")
.onclick = async () => {

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;


try {

await signInWithEmailAndPassword(
auth,
email,
password
);

loginBox.style.display = "none";

adminPanel.style.display = "block";

}

catch(error) {

document.getElementById(
"loginMessage"
).innerText =
"Email অথবা Password ভুল।";

}

};



/* LOGOUT */

document.getElementById("logoutBtn")
.onclick = () => {

signOut(auth);

location.reload();

};



/* ADD MEMBER */

document.getElementById("addMember")
.onclick = async () => {

const name =
document.getElementById("memberName").value;

const position =
document.getElementById("memberPosition").value;

const phone =
document.getElementById("memberPhone").value;


if (!name) {

alert("সদস্যের নাম দিন");

return;

}


const newMember =
push(ref(db, "members"));


await set(newMember, {

name: name,

position: position,

phone: phone

});


alert("সদস্য যোগ হয়েছে");

document.getElementById(
"memberName"
).value = "";

document.getElementById(
"memberPosition"
).value = "";

document.getElementById(
"memberPhone"
).value = "";

};



/* SHOW MEMBERS */

onValue(ref(db, "members"), snapshot => {

const box =
document.getElementById("adminMembers");

box.innerHTML = "";

const data = snapshot.val();

if (!data) return;


Object.entries(data).forEach(
([id, member]) => {

box.innerHTML += `

<div class="adminItem">

<b>${member.name}</b>

<br>

${member.position || ""}

<br>

${member.phone || ""}

<br>

<button
onclick="deleteMember('${id}')">
Delete
</button>

</div>

`;

});

});



/* DELETE MEMBER */

window.deleteMember = async (id) => {

if (confirm("সদস্য মুছে ফেলবেন?")) {

await remove(
ref(db, "members/" + id)
);

}

};



/* ADD NOTICE */

document.getElementById("addNotice")
.onclick = async () => {

const title =
document.getElementById("noticeTitle").value;

const text =
document.getElementById("noticeText").value;


if (!title || !text) {

alert("নোটিশ সম্পূর্ণ লিখুন");

return;

}


const newNotice =
push(ref(db, "notices"));


await set(newNotice, {

title: title,

text: text,

date: new Date().toLocaleDateString("bn-BD")

});


alert("নোটিশ প্রকাশ হয়েছে");


document.getElementById(
"noticeTitle"
).value = "";

document.getElementById(
"noticeText"
).value = "";

};



/* SHOW NOTICES */

onValue(ref(db, "notices"), snapshot => {

const box =
document.getElementById("adminNotices");

box.innerHTML = "";

const data = snapshot.val();

if (!data) return;


Object.entries(data).forEach(
([id, notice]) => {

box.innerHTML += `

<div class="adminItem">

<b>${notice.title}</b>

<p>${notice.text}</p>

<button
onclick="deleteNotice('${id}')">
Delete
</button>

</div>

`;

});

});



/* DELETE NOTICE */

window.deleteNotice = async (id) => {

if (confirm("নোটিশ মুছে ফেলবেন?")) {

await remove(
ref(db, "notices/" + id)
);

}

};

</script>


</body>

</html>

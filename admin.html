<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Thangmra Club</title><style>
body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f4f7f6;margin:0;color:#20303a}header{background:#062b4c;color:white;padding:20px;text-align:center}main{max-width:800px;margin:auto;padding:20px}.card{background:white;padding:20px;border-radius:16px;margin:15px 0;box-shadow:0 5px 20px #0001}label{display:block;font-weight:bold;margin:10px 0 5px}input,textarea{width:100%;padding:11px;border:1px solid #ccd6da;border-radius:8px;box-sizing:border-box}textarea{min-height:100px}button{border:0;border-radius:8px;padding:11px 16px;background:#07865b;color:white;font-weight:bold;margin:5px 3px}.danger{background:#b52b2b}#loginBox{display:block}#panel{display:none}
</style></head><body><header><h1>⚙️ Thangmra Club Admin</h1><p>অনলাইন ওয়েবসাইটের তথ্য পরিবর্তন</p></header><main>
<div class="card" id="loginBox"><h2>Admin Login</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="login">Login</button><p id="loginMsg"></p></div>
<div id="panel"><div class="card"><h2>হোম পেজ</h2><label>শিরোনাম</label><input id="title"><label>পরিচিতি</label><textarea id="intro"></textarea><button id="save">অনলাইনে সংরক্ষণ</button><button class="danger" id="logout">Logout</button><p id="msg"></p></div></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getDatabase,ref,get,set} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
login.onclick=async()=>{try{await signInWithEmailAndPassword(auth,email.value,password.value);loginMsg.textContent="লগইন হয়েছে";}catch(e){loginMsg.textContent="Login failed: "+e.message;}};
onAuthStateChanged(auth,async user=>{loginBox.style.display=user?"none":"block";panel.style.display=user?"block":"none";if(user){const s=await get(ref(db,"site"));const d=s.val()||{};title.value=d.title||"Thangmra Club";intro.value=d.intro||"ঐক্য • সেবা • উন্নয়ন";}});
save.onclick=async()=>{await set(ref(db,"site"),{title:title.value,intro:intro.value});msg.textContent="✅ অনলাইনে সংরক্ষণ হয়েছে।";};
logout.onclick=()=>signOut(auth);
</script></body></html>

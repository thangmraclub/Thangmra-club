<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thangmra Club</title><style>
body{font-family:Arial,"Noto Sans Bengali",sans-serif;margin:0;background:#f5f8f6;color:#20303a}
header{background:linear-gradient(135deg,#062b4c,#07865b);color:white;text-align:center;padding:22px}

<body><header><div class="brand"><div class="brand-logo">🌿</div><div>Thangmra Club</div></div><p>ঐক্য • সেবা • উন্নয়ন</p></header>

<main><div class="card"><h1 id="title">Thangmra Club</h1><p id="intro">লোড হচ্ছে...</p></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
const app=initializeApp(firebaseConfig), db=getDatabase(app);
onValue(ref(db,"site"),s=>{const d=s.val()||{};title.textContent=d.title||"Thangmra Club";intro.textContent=d.intro||"ঐক্য • সেবা • উন্নয়ন";});
